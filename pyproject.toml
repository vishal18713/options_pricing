[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "options-pricing-greeks-engine"
version = "0.1.0"
description = "A modular quantitative options pricing and Greeks engine implementing BSM, CRR Binomial Trees, Monte Carlo, Implied Volatility, and SVI Surface Calibration."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Options Engine Contributors" }
]
dependencies = [
    "numpy>=1.25.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
    "yfinance>=0.2.30",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "QuantLib>=1.30",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"
